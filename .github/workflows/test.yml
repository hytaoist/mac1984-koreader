name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip unzip
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - name: Validate syntax
        run: |
          bash -n build.sh install.sh uninstall.sh publish.sh \
            tests/run_deploy_test.sh tests/run_installer_test.sh tests/run_loader_test.sh
          for file in plugin/_meta.lua plugin/deploy.lua plugin/ota.lua plugin/main.lua \
            plugin/theme/apply.lua patches/2-mac1984.lua assets/simpleui-icons/pack.lua; do
            FILE="$file" lua -e 'assert(loadfile(assert(os.getenv("FILE"))))'
          done
      - name: Run tests
        run: |
          lua tests/patch_smoke_test.lua plugin/theme/apply.lua
          ./tests/run_loader_test.sh
          ./tests/run_deploy_test.sh
          ./tests/run_installer_test.sh
      - name: Build release artifacts
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac1984-koreader
          path: |
            dist/*.zip
            dist/SHA256SUMS
